name = "precatos-captacao"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Dois gatilhos:
#  - diário às 09:00 UTC (06:00 BRT): varredura do DJEN via API Comunica
#  - mensal, dia 2 às 12:00 UTC: coleta da ordem cronológica da DEPRE
[triggers]
crons = ["0 9 * * *", "0 12 2 * *"]

# Segredos (configurar com `wrangler secret put <NOME>`):
#   SUPABASE_URL              — https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — chave service_role (NUNCA a anon key em produção)
#   ADMIN_TOKEN               — token para disparos manuais via HTTP

[vars]
# Página da DEPRE/TJSP onde ficam publicadas as listas da ordem cronológica.
# Ajuste se o TJSP mudar o endereço.
DEPRE_LIST_URL = "https://www.tjsp.jus.br/Depre"
