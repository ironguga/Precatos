name: Baixar imagens do Arquivo ABM

# O ambiente do agente tem arquivo-abm.madeira.gov.pt bloqueado pelo proxy de
# egresso; o runner do GitHub tem internet aberta. Corre a cada push nesta
# branch e publica as imagens como artefacto do run.
on:
  push:
    branches: [claude/arquivo-historico-imagens-ynij2b]
    paths:
      - '.github/workflows/arquivo-abm.yml'
      - 'scripts/arquivo-abm-download.mjs'
      - 'scripts/arquivo-abm-buscar.mjs'
      - 'scripts/arquivo-abm-livros.mjs'
      - 'scripts/arquivo-abm-indexados.mjs'
      - 'scripts/arquivo-abm-canhas.mjs'
      - 'scripts/arquivo-abm-sondar.mjs'
      - 'scripts/arquivo-abm-fontes-externas.mjs'
      - 'scripts/arquivo-abm-indice-nominal.mjs'
      - 'scripts/arquivo-abm-notarial.mjs'
      - 'scripts/arquivo-abm-casamentos-antigos.mjs'
      - 'scripts/arquivo-abm-filhos.mjs'
      - 'scripts/arquivo-abm-notas.mjs'
      - 'scripts/arquivo-abm-itens-canhas.mjs'
      - 'scripts/arquivo-abm-pais.mjs'
      - 'scripts/arquivo-abm-assentos.mjs'
      - 'scripts/arquivo-abm-mapa.mjs'
      - 'scripts/arquivo-abm-variantes.mjs'
      - 'scripts/arquivo-abm-tiles.mjs'
      - 'scripts/arquivo-abm-bundle.mjs'
      - 'scripts/arquivo-abm-download-task.mjs'
      - 'scripts/arquivo-abm-sessao.mjs'
      - 'scripts/arquivo-abm-resolucao.mjs'
      - 'scripts/arquivo-abm-original.mjs'
      - 'scripts/arquivo-abm-externas2.mjs'
      - 'scripts/arquivo-abm-wayback.mjs'
      - 'scripts/familysearch-catalogo.mjs'
      - 'scripts/familysearch-navegador.mjs'
  workflow_dispatch:
    inputs:
      url:
        description: URL do visualizador
        required: false
      paginas:
        description: 'Imagens a baixar (ex.: 145-149,151-155)'
        required: false

env:
  ABM_URL: ${{ github.event.inputs.url || 'https://arquivo-abm.madeira.gov.pt/viewer/descriptions/41778' }}
  ABM_PAGINAS: ${{ github.event.inputs.paginas || '' }}
  # Livro 5.º de baptismos (1725-1743): a janela do nascimento de Pedro.
  # Livro 4.º de óbitos (1720-1749): faltam as imagens 201-292.
  # Indice dos livros de notas n.o 1 a 30 (399 paginas) e n.o 1 a 8 (163).
  # Livro 1.o de casamentos (1592-1639) e Livro 4.o (1743-1754), o que faltava.
  # Ultima tentativa ao Livro 1.o (2195) e os indices notariais.
  # Ponta do Sol: baptismos 1614-1641 e casamentos 1565-1652; Arco da Calheta 1598-1641.
  # Ponta do Sol: baptismos 1614-1641 (44085) e casamentos 1565-1652 (48721).
  # Livro 1.o de casamentos da Ponta do Sol (48721, 267 paginas servidas).
  # O assento de Diogo Fernandes Pita de 1616 esta no folio 75; com uma imagem
  # por pagina, cai por volta da imagem 150. Baixa-se 140-166, e 14-26 para
  # calibrar pelos folios 9 e 11 dos assentos 22 e 33.
  # Os rois de crismados dos Canhas nao tem imagem propria, mas todos declaram
  # Parent 2828 — a serie. Se a serie servir paginas, o rol de 1643 le-se.
  ABM_LIVROS: ''
  # Assentos servidos por descricao: o Livro 1.o (2195) nao serve paginas,
  # mas 170550 — Manuel Correia c.c. Francisca Lopes, 1622, f. 31 v.o — traz
  # StorageDisseminationID proprio. 170161 e o Diogo Fernandes Pita de 1641.
  # Uma fatia do Livro 1.o na mao do mesmo vigario, Balthesior Alvares de
  # Araujo: se ele escreveu mais vezes a freguesia de origem de alguem, uma
  # das instancias estara em tinta melhor do que a do assento 84.
  # O indice da Ponta do Sol da um DIOGO FERNANDES PITA a casar la em 1616,
  # 25 anos antes do dos Canhas, e Pitas desde 1569. 603056 e esse assento;
  # os outros sao os Pita mais antigos e os Correa da mesma freguesia.
  # Rois de crismados dos Canhas: 1643 (44110), 1685 (44113), 1691 (44112),
  # 1732 (44108), 1742 (44109). O de 1643 e dois anos depois de Diogo Fernandes
  # Pita casar nos Canhas; um rol de crisma nomeia quem se crismou e, muitas
  # vezes, os pais. Sao descricoes de nivel D, logo podem servir imagem propria.
  ABM_ITENS: '44110 44113 44112 44108 44109'

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mapear os livros da paróquia dos Canhas
        if: false
        continue-on-error: true
        run: node scripts/arquivo-abm-livros.mjs 'PT/ABM/PPTS01' 'PT/ABM/PPTS01/001' 'baptismos dos Canhas' 2>&1 | tail -40

      # O levantamento exaustivo vai para um ficheiro comitado na branch: o
      # ambiente do agente não alcança nem o artefacto nem o log do run.
      - name: Interrogar o índice nominal do ABM
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-indice-nominal.mjs > arquivo/abm-indice-nominal.txt 2>&1 || true
          cat arquivo/abm-indice-nominal.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-indice-nominal.txt
          git diff --cached --quiet || {
            git commit -m 'Índice nominal do ABM: o que devolve para os nomes da linha'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Procurar em genealogias publicadas e fóruns
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-fontes-externas.mjs > arquivo/fontes-externas.txt 2>&1 || true
          wc -l arquivo/fontes-externas.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/fontes-externas.txt
          git diff --cached --quiet || {
            git commit -m 'Busca dos Pitta dos Canhas em fontes fora do arquivo'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Procurar séries notariais e judiciais
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-notarial.mjs | tee arquivo/abm-notarial.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-notarial.txt
          git diff --cached --quiet || {
            git commit -m 'Busca de séries notariais e judiciais que nomeiem os Pitta'
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
          }

      - name: Sondar o que está mesmo digitalizado
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-sondar.mjs 44085 44101 48721 48722 51147 44086 44087 44100 44102 | tee arquivo/abm-canhas-sonda.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-canhas-sonda.txt
          git diff --cached --quiet || {
            git commit -m 'Sonda: que livros dos Canhas têm mesmo imagens em linha'
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
          }

      - name: Levantar os livros de casamentos anteriores a 1745
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-casamentos-antigos.mjs 39000 52000 > arquivo/abm-casamentos-antigos.txt 2> >(tail -5 >&2) || true
          wc -l arquivo/abm-casamentos-antigos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-casamentos-antigos.txt
          git diff --cached --quiet || {
            git commit -m 'Levantamento dos livros de casamentos e baptismos anteriores a 1745'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Descobrir o identificador do Livro 1.o de casamentos
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-pais.mjs 170550 170161 169595 169383 > arquivo/abm-pais-assentos.txt 2>&1 || true
          cat arquivo/abm-pais-assentos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-pais-assentos.txt
          git diff --cached --quiet || {
            git commit -m 'Identificadores dos livros a que pertencem os assentos-chave'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Varrer os assentos das freguesias PPTS02 a PPTS09
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # A Ponta do Sol e PPTS03: os seus assentos nao estao no intervalo ja
          # varrido (200000-340000, que so deu PPTS02). Alarga-se a busca, e
          # pede-se ao mesmo tempo o nome de cada fundo paroquial.
          ABM_CODIGO='PPTS0[2-9]' node scripts/arquivo-abm-itens-canhas.mjs 340000 470000 > arquivo/abm-itens-vizinhas2.txt 2> >(tail -5 >&2) || true
          wc -l arquivo/abm-itens-vizinhas2.txt
          node scripts/arquivo-abm-pais.mjs 47511 47512 47513 47514 47515 > arquivo/abm-fundos.txt 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-itens-vizinhas2.txt arquivo/abm-fundos.txt
          git diff --cached --quiet || {
            git commit -m 'Assentos das freguesias vizinhas noutro intervalo de identificadores'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Listar os nomes de todas as paroquias do arquivo
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # Os fundos paroquiais estao juntos por volta do 47500 (47511 = Paroquia
          # dos Canhas, 47514 = Porto do Moniz). A lista dos nomes e a lista de
          # candidatos para a freguesia plural e feminina do assento de 1622.
          node scripts/arquivo-abm-mapa.mjs 47400 47700 1 > arquivo/abm-paroquias.txt 2>/dev/null || true
          grep -E 'Par[oó]quia|Freguesia' arquivo/abm-paroquias.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-paroquias.txt
          git diff --cached --quiet || {
            git commit -m 'Nomes de todas as paroquias do arquivo, e as suas descricoes de fundo'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Varrer os assentos da Ponta do Sol, agora com a faixa certa
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # O mapa poe a Ponta do Sol (PPTS03) em 597000-610000, e o Livro 1.o de
          # casamentos (1565/1652) por volta de 602800-603250. Varre-se com folga.
          ABM_CODIGO='PPTS03' node scripts/arquivo-abm-itens-canhas.mjs 594000 614000 > arquivo/abm-itens-pontadosol.txt 2> >(tail -3 >&2) || true
          wc -l arquivo/abm-itens-pontadosol.txt
          echo '--- Correa e Pita antes de 1700 ---'
          grep -iE 'corre|pit' arquivo/abm-itens-pontadosol.txt | grep -E ' 1[56][0-9]{2} ' || echo 'nenhum'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-itens-pontadosol.txt
          git diff --cached --quiet || {
            git commit -m 'Indice nominal da Ponta do Sol: os assentos vivem acima dos 597 mil'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Mapear as faixas de identificadores do arquivo
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-mapa.mjs 1 620000 400 > arquivo/abm-mapa.txt 2> >(tail -3 >&2) || true
          tail -40 arquivo/abm-mapa.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-mapa.txt
          git diff --cached --quiet || {
            git commit -m 'Mapa das faixas de identificadores: que fundo vive em que intervalo'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Baixar as imagens ao nivel do assento
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo/assentos
          node scripts/arquivo-abm-assentos.mjs $ABM_ITENS 2>&1 | tee arquivo/abm-assentos.txt
          node scripts/arquivo-abm-pais.mjs 2195 44085 48721 > arquivo/abm-livros-fechados.txt 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/assentos arquivo/abm-assentos.txt arquivo/abm-livros-fechados.txt
          git diff --cached --quiet || {
            git commit -m 'Imagens dos assentos do Livro 1.o, servidas por descricao e nao por livro'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Testar resolucao, variantes e outros repositorios
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          npm i -D playwright@1.49.0 >/dev/null 2>&1 || true
          npx playwright install --with-deps chromium >/dev/null 2>&1 || true
          node scripts/familysearch-navegador.mjs > arquivo/familysearch.txt 2>&1 || true
          cat arquivo/familysearch.txt
          # package.json e package-lock.json SAO versionados neste repositorio:
          # o 'npm i' altera-os e o 'pull --rebase' recusa-se a correr com
          # alteracoes por preparar. Reponho-os ao estado do ramo.
          git checkout -- package.json package-lock.json 2>/dev/null || true
          rm -rf node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/familysearch.txt
          git diff --cached --quiet || {
            git commit -m 'FamilySearch lido com navegador, so as paginas publicas'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Indice nominal da Ponta do Sol noutros intervalos
        if: false
        continue-on-error: true
        env:
          ABM_CODIGO: 'PPTS03|PPTS02'
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-itens-canhas.mjs 200000 340000 > arquivo/abm-itens-vizinhas.txt 2> >(tail -6 >&2) || true
          wc -l arquivo/abm-itens-vizinhas.txt
          grep -i 'pit' arquivo/abm-itens-vizinhas.txt | head -40 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-itens-vizinhas.txt
          git diff --cached --quiet || {
            git commit -m 'Indice nominal da Ponta do Sol noutros intervalos de identificador'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Procurar os livros de notas dos tabeliaes
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-notas.mjs 60000 120000 > arquivo/abm-notas-tabeliaes-2.txt 2> >(tail -5 >&2) || true
          wc -l arquivo/abm-notas-tabeliaes-2.txt
          node scripts/arquivo-abm-sondar.mjs 54600 54654 42993 52097 >> arquivo/abm-notas-tabeliaes-2.txt 2>&1 || true
          tail -20 arquivo/abm-notas-tabeliaes-2.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-notas-tabeliaes-2.txt
          git diff --cached --quiet || {
            git commit -m 'Livros de notas e series judiciais anteriores a 1800'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Listar os volumes das series paroquiais vizinhas
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-filhos.mjs 51147 50976 51153 51894 48721 48722 > arquivo/abm-series-filhos.txt 2>&1 || true
          wc -l arquivo/abm-series-filhos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-series-filhos.txt
          git diff --cached --quiet || {
            git commit -m 'Volumes das series de casamentos das freguesias vizinhas'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Comitar o levantamento
        if: false
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-canhas-acervo.txt arquivo/abm-canhas-acervo-2.txt
          if git diff --cached --quiet; then
            echo 'Levantamento sem alterações.'
            exit 0
          fi
          git commit -m 'Levantamento do acervo dos Canhas em linha no ABM'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Procurar em fontes com indexação nominal
        if: false
        continue-on-error: true
        run: node scripts/arquivo-abm-indexados.mjs

      # ABM_LIVROS: lista "id:páginas" separada por espaços. Cada livro vai para
      # a sua pasta e é comitado à parte, para o run não se perder todo se um
      # livro falhar.
      - name: Procurar o Livro 1.o de baptismos da Ponta do Sol
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # 44085 e o Livro 2.o de baptismos (1614/1641). O Livro 1.o, se existir,
          # cobre os anos 1590 — e e la que estaria o baptizado de Diogo Fernandes
          # Pita, que nomeia os pais dele. Sonda-se a vizinhanca do identificador.
          node scripts/arquivo-abm-mapa.mjs 44070 44120 1 > arquivo/abm-baptismos-pontadosol.txt 2>/dev/null || true
          cat arquivo/abm-baptismos-pontadosol.txt
          echo '--- estado de cada um ---'
          node scripts/arquivo-abm-sondar.mjs 44084 44083 44082 44081 44080 44100 44101 >> arquivo/abm-baptismos-pontadosol.txt 2>&1 || true
          tail -12 arquivo/abm-baptismos-pontadosol.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-baptismos-pontadosol.txt
          git diff --cached --quiet || {
            git commit -m 'Os livros de baptismos da Ponta do Sol e o que cada um serve'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Ver que variantes o catalogo declara para o folio 75
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-variantes.mjs 48721 143 144 142 | tee arquivo/abm-variantes-48721.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-variantes-48721.txt
          git diff --cached --quiet || {
            git commit -m 'Variantes declaradas para o folio 75 da Ponta do Sol'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Sondar a serie dos rois de crismados
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-sondar.mjs 2828 2827 2829 | tee arquivo/abm-rois-canhas.txt
          node scripts/arquivo-abm-pais.mjs 2828 >> arquivo/abm-rois-canhas.txt 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-rois-canhas.txt
          git diff --cached --quiet || {
            git commit -m 'Estado da serie dos rois de crismados dos Canhas'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Varrer os indices mais antigos de toda a ilha
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # O mapa localizou o bloco de assentos mais antigo de cada paroquia.
          # Varrem-se esses blocos a procura de um Correa a casar antes de 1625:
          # se o Correa velho casou nalgum deles, o assento nomeia os pais DELE.
          # PFUN10 Se do Funchal (desde 1544) · PFUN08 Sao Pedro · PFUN09
          # PRBR02 Ribeira Brava · PCML03 Estreito de C. de Lobos
          # PCLT04 Faja da Ovelha · PSTN03 Santana
          for faixa in "555000 563000" "489000 495000" "439000 444000" "474000 479000" \
                       "196000 201000" "222000 227000" "313000 318000" "369000 374000"; do
            set -- $faixa
            echo "=== $1-$2 ==="
            ABM_CODIGO='PT/ABM/P' node scripts/arquivo-abm-itens-canhas.mjs "$1" "$2" \
              >> arquivo/abm-itens-ilha.txt 2> >(tail -2 >&2) || true
          done
          wc -l arquivo/abm-itens-ilha.txt
          echo '--- Correa antes de 1630 ---'
          grep -iE 'corre[ia]' arquivo/abm-itens-ilha.txt | grep -E ' 1[56][0-2][0-9] ' || echo nenhum
          echo '--- Pita antes de 1650 ---'
          grep -iE 'pit[ae]' arquivo/abm-itens-ilha.txt | grep -E ' 1[56][0-4][0-9] ' || echo nenhum
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-itens-ilha.txt
          git diff --cached --quiet || {
            git commit -m 'Indices mais antigos de toda a ilha: onde ha Correa e Pita antes de 1650'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: A lista completa das paroquias, e as faixas que faltam
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # A palavra por ler no assento de 1622 e um nome PLURAL e FEMININO
          # («da freguesia das ...»). O conjunto de candidatas e fechado: sao as
          # paroquias da ilha. So tenho 19 nomes; faltam cerca de trinta.
          node scripts/arquivo-abm-mapa.mjs 47000 48600 1 > arquivo/abm-paroquias2.txt 2>/dev/null || true
          grep -E 'Par[oó]quia|Freguesia|Curral|Achada' arquivo/abm-paroquias2.txt || true
          # E as paroquias antigas que faltaram a varredura: Camara de Lobos
          # (1570), Arco da Calheta (1592), Machico, Santa Cruz, Sao Vicente.
          for faixa in "146000 152000" "95000 100000" "176000 181000" "213000 218000" \
                       "508000 513000" "530000 536000" "271000 276000"; do
            set -- $faixa
            echo "=== $1-$2 ==="
            ABM_CODIGO='PT/ABM/P' node scripts/arquivo-abm-itens-canhas.mjs "$1" "$2" \
              >> arquivo/abm-itens-ilha2.txt 2> >(tail -2 >&2) || true
          done
          wc -l arquivo/abm-itens-ilha2.txt
          echo '--- noivos Correa antes de 1610 ---'
          grep -iE 'casamento: [^,]*corre[ia]' arquivo/abm-itens-ilha2.txt | grep -E ' 1[56][0-9]{2} ' | head -30 || echo nenhum
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-paroquias2.txt arquivo/abm-itens-ilha2.txt
          git diff --cached --quiet || {
            git commit -m 'Lista completa das paroquias e as faixas antigas que faltavam'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: As tres ultimas paroquias antigas
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          # Camara de Lobos (livro 1.o e 2.o de casamentos, ~137000-140000),
          # Campanario (~156000-159000) e Sao Vicente (~542000-545000) foram as
          # unicas cujas faixas antigas as varreduras anteriores nao apanharam.
          for faixa in "136500 140500" "155500 159500" "541500 545500"; do
            set -- $faixa
            echo "=== $1-$2 ==="
            ABM_CODIGO='PT/ABM/P' node scripts/arquivo-abm-itens-canhas.mjs "$1" "$2" \
              >> arquivo/abm-itens-ilha3.txt 2> >(tail -2 >&2) || true
          done
          wc -l arquivo/abm-itens-ilha3.txt
          echo '--- noivos Correa antes de 1610 ---'
          grep -iE 'casamento: [^,]*corre[ia]' arquivo/abm-itens-ilha3.txt | grep -E ' 1[56][0-9]{2} ' | head -20 || echo nenhum
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-itens-ilha3.txt
          git diff --cached --quiet || {
            git commit -m 'Camara de Lobos, Campanario e Sao Vicente: as ultimas faixas antigas'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: O visualizador deixa ampliar? Sondar mosaicos e IIIF
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-tiles.mjs 48721 2FDB4B09315CCCB4DC8AB4B779CEE1B5 \
            497028441981BA1B3011001ED8950928 2>&1 | tee arquivo/abm-mosaicos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-mosaicos.txt
