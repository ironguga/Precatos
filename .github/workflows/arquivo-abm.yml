name: Baixar imagens do Arquivo ABM

# O ambiente do agente tem arquivo-abm.madeira.gov.pt bloqueado pelo proxy de
# egresso; o runner do GitHub tem internet aberta. Corre a cada push nesta
# branch e publica as imagens como artefacto do run.
on:
  push:
    branches: [claude/arquivo-historico-imagens-ynij2b]
    paths:
      - '.github/workflows/arquivo-abm.yml'
      - 'scripts/arquivo-abm-download.mjs'
      - 'scripts/arquivo-abm-buscar.mjs'
      - 'scripts/arquivo-abm-livros.mjs'
  workflow_dispatch:
    inputs:
      url:
        description: URL do visualizador
        required: false
      paginas:
        description: 'Imagens a baixar (ex.: 145-149,151-155)'
        required: false

env:
  ABM_URL: ${{ github.event.inputs.url || 'https://arquivo-abm.madeira.gov.pt/viewer/descriptions/42119' }}
  ABM_PAGINAS: ${{ github.event.inputs.paginas || '1,40,80,120,160,200,240,280,320,360,400,440,480,520,560,600' }}

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mapear os livros da paróquia dos Canhas
        continue-on-error: true
        run: node scripts/arquivo-abm-livros.mjs 42120 42260

      - name: Baixar imagens
        run: |
          echo "ABM_ID=$(echo "$ABM_URL" | grep -oE 'descriptions/[0-9]+' | cut -d/ -f2)" >> "$GITHUB_ENV"
          node scripts/arquivo-abm-download.mjs "$ABM_URL" "$ABM_PAGINAS" --out imagens

      - uses: actions/upload-artifact@v4
        with:
          name: imagens-canhas-casamentos
          path: imagens/
          retention-days: 90

      # Também comita as imagens na branch: o artefacto vive em armazenamento
      # que o ambiente do agente não alcança, mas o git sim.
      - name: Comitar as imagens na branch
        run: |
          destino="arquivo/abm-$ABM_ID"
          mkdir -p "$destino"
          cp imagens/*.jpg "$destino"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$destino"
          if git diff --cached --quiet; then
            echo 'Sem imagens novas para comitar.'
            exit 0
          fi
          git commit -m "Imagens da descrição ABM $ABM_ID (fólios pedidos)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
