      - name: O endpoint tasks/download, que eu nunca tinha visto
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo/assentos
          node scripts/arquivo-abm-download-task.mjs 2>&1 | tee arquivo/abm-download-task.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-download-task.txt arquivo/assentos
          git diff --cached --quiet || {
            git commit -m 'Sonda ao endpoint tasks/download do Archeevo'
            for t in 1 2 3 4; do
