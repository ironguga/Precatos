name: Baixar imagens do Arquivo ABM

# O ambiente do agente tem arquivo-abm.madeira.gov.pt bloqueado pelo proxy de
# egresso; o runner do GitHub tem internet aberta. Corre a cada push nesta
# branch e publica as imagens como artefacto do run.
on:
  push:
    branches: [claude/arquivo-historico-imagens-ynij2b]
    paths:
      - '.github/workflows/arquivo-abm.yml'
      - 'scripts/arquivo-abm-download.mjs'
      - 'scripts/arquivo-abm-probe-hires.mjs'
  workflow_dispatch:
    inputs:
      url:
        description: URL do visualizador
        required: false
      paginas:
        description: 'Imagens a baixar (ex.: 145-149,151-155)'
        required: false

env:
  ABM_URL: ${{ github.event.inputs.url || 'https://arquivo-abm.madeira.gov.pt/viewer/descriptions/41778/247955' }}
  ABM_PAGINAS: ${{ github.event.inputs.paginas || '145-149,151-155' }}

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Procurar variante de maior resolução
        continue-on-error: true
        run: node scripts/arquivo-abm-probe-hires.mjs "$ABM_URL"

      - name: Baixar imagens
        run: node scripts/arquivo-abm-download.mjs "$ABM_URL" "$ABM_PAGINAS" --out imagens

      - name: Conferir dimensões
        run: |
          ls -lh imagens
          for f in imagens/*.jpg; do
            printf '%s  ' "$f"
            node -e '
              const b=require("fs").readFileSync(process.argv[1]);
              let i=2;
              while(i<b.length){
                if(b[i]!==0xFF){i++;continue}
                const m=b[i+1];
                if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){
                  console.log(b.readUInt16BE(i+7)+" x "+b.readUInt16BE(i+5)+" px");break;
                }
                i+=2+b.readUInt16BE(i+2);
              }' "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: imagens-canhas-casamentos
          path: imagens/
          retention-days: 90
