name: Baixar imagens do Arquivo ABM

# O ambiente do agente tem arquivo-abm.madeira.gov.pt bloqueado pelo proxy de
# egresso; o runner do GitHub tem internet aberta. Corre a cada push nesta
# branch e publica as imagens como artefacto do run.
on:
  push:
    branches: [claude/arquivo-historico-imagens-ynij2b]
    paths:
      - '.github/workflows/arquivo-abm.yml'
      - 'scripts/arquivo-abm-download.mjs'
      - 'scripts/arquivo-abm-buscar.mjs'
      - 'scripts/arquivo-abm-livros.mjs'
      - 'scripts/arquivo-abm-indexados.mjs'
      - 'scripts/arquivo-abm-canhas.mjs'
      - 'scripts/arquivo-abm-sondar.mjs'
      - 'scripts/arquivo-abm-fontes-externas.mjs'
      - 'scripts/arquivo-abm-indice-nominal.mjs'
      - 'scripts/arquivo-abm-notarial.mjs'
      - 'scripts/arquivo-abm-casamentos-antigos.mjs'
      - 'scripts/arquivo-abm-filhos.mjs'
  workflow_dispatch:
    inputs:
      url:
        description: URL do visualizador
        required: false
      paginas:
        description: 'Imagens a baixar (ex.: 145-149,151-155)'
        required: false

env:
  ABM_URL: ${{ github.event.inputs.url || 'https://arquivo-abm.madeira.gov.pt/viewer/descriptions/41778' }}
  ABM_PAGINAS: ${{ github.event.inputs.paginas || '' }}
  # Livro 5.º de baptismos (1725-1743): a janela do nascimento de Pedro.
  # Livro 4.º de óbitos (1720-1749): faltam as imagens 201-292.
  ABM_LIVROS: '48628:201-292'

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mapear os livros da paróquia dos Canhas
        if: false
        continue-on-error: true
        run: node scripts/arquivo-abm-livros.mjs 'PT/ABM/PPTS01' 'PT/ABM/PPTS01/001' 'baptismos dos Canhas' 2>&1 | tail -40

      # O levantamento exaustivo vai para um ficheiro comitado na branch: o
      # ambiente do agente não alcança nem o artefacto nem o log do run.
      - name: Interrogar o índice nominal do ABM
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-indice-nominal.mjs > arquivo/abm-indice-nominal.txt 2>&1 || true
          cat arquivo/abm-indice-nominal.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-indice-nominal.txt
          git diff --cached --quiet || {
            git commit -m 'Índice nominal do ABM: o que devolve para os nomes da linha'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Procurar em genealogias publicadas e fóruns
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-fontes-externas.mjs > arquivo/fontes-externas.txt 2>&1 || true
          wc -l arquivo/fontes-externas.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/fontes-externas.txt
          git diff --cached --quiet || {
            git commit -m 'Busca dos Pitta dos Canhas em fontes fora do arquivo'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Procurar séries notariais e judiciais
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-notarial.mjs | tee arquivo/abm-notarial.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-notarial.txt
          git diff --cached --quiet || {
            git commit -m 'Busca de séries notariais e judiciais que nomeiem os Pitta'
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
          }

      - name: Sondar o que está mesmo digitalizado
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-sondar.mjs 42092 42081 41773 48628 42119 | tee arquivo/abm-canhas-sonda.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-canhas-sonda.txt
          git diff --cached --quiet || {
            git commit -m 'Sonda: que livros dos Canhas têm mesmo imagens em linha'
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME"
          }

      - name: Levantar os livros de casamentos anteriores a 1745
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-casamentos-antigos.mjs 39000 52000 > arquivo/abm-casamentos-antigos.txt 2> >(tail -5 >&2) || true
          wc -l arquivo/abm-casamentos-antigos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-casamentos-antigos.txt
          git diff --cached --quiet || {
            git commit -m 'Levantamento dos livros de casamentos e baptismos anteriores a 1745'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Listar os volumes das series paroquiais vizinhas
        if: false
        continue-on-error: true
        run: |
          mkdir -p arquivo
          node scripts/arquivo-abm-filhos.mjs 51147 50976 51153 51894 48721 48722 > arquivo/abm-series-filhos.txt 2>&1 || true
          wc -l arquivo/abm-series-filhos.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-series-filhos.txt
          git diff --cached --quiet || {
            git commit -m 'Volumes das series de casamentos das freguesias vizinhas'
            for t in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** t))
            done
          }

      - name: Comitar o levantamento
        if: false
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f arquivo/abm-canhas-acervo.txt arquivo/abm-canhas-acervo-2.txt
          if git diff --cached --quiet; then
            echo 'Levantamento sem alterações.'
            exit 0
          fi
          git commit -m 'Levantamento do acervo dos Canhas em linha no ABM'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Procurar em fontes com indexação nominal
        if: false
        continue-on-error: true
        run: node scripts/arquivo-abm-indexados.mjs

      # ABM_LIVROS: lista "id:páginas" separada por espaços. Cada livro vai para
      # a sua pasta e é comitado à parte, para o run não se perder todo se um
      # livro falhar.
      - name: Baixar e comitar os livros pedidos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for par in $ABM_LIVROS; do
            id="${par%%:*}"; pags="${par#*:}"
            echo "=== livro $id, páginas $pags ==="
            rm -rf imagens && mkdir -p imagens
            if ! node scripts/arquivo-abm-download.mjs \
                 "https://arquivo-abm.madeira.gov.pt/viewer/descriptions/$id" \
                 "$pags" --out imagens; then
              echo "livro $id falhou; sigo para o próximo"
              continue
            fi
            destino="arquivo/abm-$id"
            mkdir -p "$destino"
            cp imagens/*.jpg "$destino"/ 2>/dev/null || { echo "sem imagens"; continue; }
            git add -f "$destino"
            git diff --cached --quiet && { echo 'nada de novo'; continue; }
            git commit -m "Imagens da descrição ABM $id"
            for tentativa in 1 2 3 4; do
              git pull --rebase origin "$GITHUB_REF_NAME" && \
                git push origin HEAD:"$GITHUB_REF_NAME" && break
              sleep $((2 ** tentativa))
            done
          done

      - name: Baixar imagens
        if: env.ABM_PAGINAS != ''
        run: |
          echo "ABM_ID=$(echo "$ABM_URL" | grep -oE 'descriptions/[0-9]+' | cut -d/ -f2)" >> "$GITHUB_ENV"
          node scripts/arquivo-abm-download.mjs "$ABM_URL" "$ABM_PAGINAS" --out imagens

      - uses: actions/upload-artifact@v4
        if: env.ABM_PAGINAS != ''
        with:
          name: imagens-canhas-casamentos
          path: imagens/
          retention-days: 90

      # Também comita as imagens na branch: o artefacto vive em armazenamento
      # que o ambiente do agente não alcança, mas o git sim.
      - name: Comitar as imagens na branch
        if: env.ABM_PAGINAS != ''
        run: |
          destino="arquivo/abm-$ABM_ID"
          mkdir -p "$destino"
          cp imagens/*.jpg "$destino"/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$destino"
          if git diff --cached --quiet; then
            echo 'Sem imagens novas para comitar.'
            exit 0
          fi
          git commit -m "Imagens da descrição ABM $ABM_ID (fólios pedidos)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
